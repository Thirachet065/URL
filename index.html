<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โปรไฟล์นักศึกษา - ธีรเชษฐ์ เดชพรม</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes rainbowWave {
            0% {
                background-position: 0% center;
            }
            50% {
                background-position: 100% center;
            }
            100% {
                background-position: 0% center;
            }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(90deg, #ff0000 0%, #ff7f00 14%, #ffff00 28%, #00ff00 42%, #0000ff 57%, #4b0082 71%, #9400d3 100%, #ff0000 120%);
            background-size: 200% 200%;
            animation: rainbowWave 4s ease-in-out infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, #ff0000 0%, #ff7f00 14%, #ffff00 28%, #00ff00 42%, #0000ff 57%, #4b0082 71%, #9400d3 100%, #ff0000 120%);
            background-size: 200% 200%;
            animation: rainbowWave 4s ease-in-out infinite;
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            padding: 40px;
        }

        .image-section {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-frame {
            position: relative;
            width: 100%;
            max-width: 350px;
        }

        .image-frame img {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: block;
        }

        .image-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            pointer-events: none;
        }

        .info-section h2 {
            background: linear-gradient(90deg, #ff0000 0%, #ff7f00 14%, #ffff00 28%, #00ff00 42%, #0000ff 57%, #4b0082 71%, #9400d3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1.8em;
            margin-bottom: 20px;
            border-bottom: 3px solid;
            border-image: linear-gradient(90deg, #ff0000 0%, #ff7f00 14%, #ffff00 28%, #00ff00 42%, #0000ff 57%, #4b0082 71%, #9400d3 100%) 1;
            padding-bottom: 10px;
        }

        .info-item {
            margin-bottom: 20px;
        }

        .info-item h3 {
            background: linear-gradient(90deg, #ff0000 0%, #ff7f00 14%, #ffff00 28%, #00ff00 42%, #0000ff 57%, #4b0082 71%, #9400d3 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 1em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
        }

        .info-item p {
            color: #555;
            line-height: 1.6;
            font-size: 0.95em;
            margin-left: 25px;
        }

        .student-id {
            color: #333;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
            font-size: 1.1em;
            border: 2px solid;
            border-image: linear-gradient(90deg, #ff0000 0%, #ff7f00 14%, #ffff00 28%, #00ff00 42%, #0000ff 57%, #4b0082 71%, #9400d3 100%) 1;
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
                gap: 30px;
            }

            .header h1 {
                font-size: 2em;
            }

            .image-frame {
                max-width: 100%;
            }
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            border-top: 1px solid #ddd;
            font-size: 0.9em;
        }

        .divider {
            height: 1px;
            background: #ddd;
            margin: 15px 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📋 โปรไฟล์นักศึกษา</h1>
            <p>วิทยาลัยเทคนิค สาขาสารสนเทศ</p>
        </div>

        <div class="content">
            <div class="image-section">
                <div class="image-frame">
                    <img src="mm.png" alt="รูปนักศึกษา">
                    <div class="image-overlay"></div>
                </div>
            </div>

            <div class="info-section">
                <h2>ข้อมูลส่วนตัว</h2>

                <div class="info-item">
                    <h3>👤 ชื่อ-นามสกุล</h3>
                    <p>ธีรเชษฐ์ เดชพรม</p>
                </div>

                <div class="info-item">
                    <h3>🔢 เลขที่</h3>
                    <p>7</p>
                </div>

                <div class="divider"></div>

                <div class="info-item">
                    <h3>🎓 ระดับชั้น</h3>
                    <p>ปวช. ชั้นที่ 2/10</p>
                </div>

                <div class="info-item">
                    <h3>📚 สาขาวิชา</h3>
                    <p>สารสนเทศ</p>
                </div>

                <div class="divider"></div>

                <div class="student-id">
                    รหัสนักศึกษา: 681110142
                </div>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2026 วิทยาลัยเทคนิค - สาขาสารสนเทศ</p>
        </div>
    </div>
</body>
</html>
